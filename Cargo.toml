[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/figstudio", "apps/figstudio-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
figstudio-fig = { path = "crates/fig" }
figstudio-render = { path = "crates/render" }
kiwi-schema = "0.2.1"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "png", "u8_pipeline"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "variable-fonts"] }
eframe = { version = "0.36", default-features = false }
egui = "0.36"
rfd = "0.17"
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
