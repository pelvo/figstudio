[package]
name = "figstudio-mcp-core"
description = "Node IDs, links and the tool logic shared by the MCP server and the app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# `default-features = false` is the wasm32 build: no installed fonts, no files written.
default = ["fs", "system-fonts"]
# `Assets::Dir` writes rendered assets; without it that mode gives an error result.
fs = ["dep:tempfile"]
# Draw text that has no stored glyph outlines with fonts installed on this machine.
system-fonts = ["figstudio-render/system-fonts"]

[dependencies]
tracing.workspace = true
figstudio-fig = { workspace = true }
# node_bounds for the region walk; no default features, so it stays wasm-safe (no system fonts).
figstudio-render = { workspace = true }
url = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
quick-xml = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
html-escape = { workspace = true }
tempfile = { workspace = true, optional = true }
percent-encoding = { workspace = true }

[dev-dependencies]
epaint_default_fonts = "0.36"
vello_cpu = { workspace = true }
# local_copy tests: folders of .fig files with set modification times.
tempfile = { workspace = true }
# tests/svg.rs: rasterize exported SVG to compare it with the PNG render (linebender's
# maintained SVG renderer; no text or system fonts needed, text is exported as outlines;
# raster-images so image fills, embedded as data URLs, are drawn and compared too).
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
# tests/shaders_missing.rs: shader zips built in the test.
zip = { workspace = true, features = ["deflate-flate2"] }

[lints]
workspace = true
