# Releases with release-please. Every push to main updates one release PR (version bump in
# Cargo.toml and Cargo.lock, CHANGELOG.md from the Conventional Commit titles). Merging that
# PR tags vX.Y.Z and publishes a GitHub release; the jobs below then build the macOS app and
# the Linux CLI/MCP binaries (x86_64 and arm64, static musl), attach them to the release,
# and the last job writes SHA256SUMS for every asset (pelvo/homebrew-tap reads it).
#
# The build runs in this workflow, not on `release: published`: a release made with
# GITHUB_TOKEN does not start other workflows.
#
# Retry: if a build failed, or a release has no assets, run this workflow by hand
# (Actions > release-please > Run workflow) with the release's tag. It rebuilds that tag and
# replaces the assets.
#
# Token: GITHUB_TOKEN, which needs Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests" (on in the org and this repo).
# Optional: a repo secret RELEASE_PLEASE_TOKEN (Contents and Pull requests write) is used
# instead when set.
#
# CI on the release PR: with GITHUB_TOKEN, the release PR's pull_request runs of ci.yml
# wait in an approval-required state; a writer clicks "Approve workflows to run" on the PR
# so the required checks report. With RELEASE_PLEASE_TOKEN they start on their own. Do not
# dispatch ci.yml instead: workflow_dispatch checks never satisfy a ruleset's required
# checks.
#
# Third-party actions are pinned to commit SHAs; the comment names the release.

name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attach assets to (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  macos:
    needs: release-please
    # !cancelled(): on a manual run the release-please job is skipped, which would skip this
    # job too without it.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || needs.release-please.outputs.release_created == 'true')
    # Apple silicon runner: the build is arm64.
    runs-on: macos-latest
    permissions:
      contents: write # gh release upload
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fully qualified: checkout resolves a bare name to a branch before a tag, so a
          # branch named like the tag would be built and its assets uploaded.
          ref: refs/tags/${{ env.TAG }}
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep this repo's crates so a retry of this job does not compile them again.
          # `v1-rust` misses the old entries, which have no workspace crates. An exact
          # hit does not save. Do not set `shared-key`: at this pin it replaces the job
          # id, so another job using the same tag would share this target directory.
          prefix-key: v1-rust
          cache-workspace-crates: true
      - name: Build figstudio.app
        run: scripts/macos-app.sh
      - name: Package
        run: |
          rm -rf dist && mkdir dist
          app="figstudio-$TAG-macos-arm64.zip"
          tools="figstudio-cli-mcp-$TAG-macos-arm64.tar.gz"
          # ditto keeps the bundle's signature and symlinks intact (plain zip does not).
          ditto -c -k --keepParent target/release/figstudio.app "dist/$app"
          tar -C target/release -czf "dist/$tools" figstudio-cli figstudio-mcp
      - name: Attach to the release
        run: gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"

  linux:
    needs: release-please
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || needs.release-please.outputs.release_created == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest}
          - {arch: arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm}
    # Native runner per arch. musl links statically, so one binary runs on any distro
    # (glibc or Alpine); renders measured as fast as the glibc build.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # gh release upload
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          key: ${{ matrix.target }}
          cache-workspace-crates: true
      - name: Build
        run: cargo build --locked --release -p figstudio-cli -p figstudio-mcp --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release
          for b in figstudio-cli figstudio-mcp; do
            file "$bin/$b" | tee /dev/stderr | grep -qE "static(ally|-pie) linked"
          done
          "$bin/figstudio-cli" info tests/fixtures/structure.fig >/dev/null
          "$bin/figstudio-mcp" --help >/dev/null
      - name: Package
        run: |
          rm -rf dist && mkdir dist
          tar -C target/${{ matrix.target }}/release -czf \
            "dist/figstudio-cli-mcp-$TAG-linux-${{ matrix.arch }}.tar.gz" figstudio-cli figstudio-mcp
      - name: Attach to the release
        run: gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"

  checksums:
    needs: [release-please, macos, linux]
    # Only when every build attached its files, so SHA256SUMS covers the whole release.
    if: >-
      !cancelled() && needs.macos.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Write SHA256SUMS
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.zip' -p '*.tar.gz'
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
