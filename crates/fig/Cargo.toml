[package]
name = "figstudio-fig"
description = "Decoder for Figma .fig local copies"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
kiwi-schema = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }
zip = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
html-escape = { workspace = true }
sha1 = { workspace = true }
same-file = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }

# Atomic no-overwrite rename (`RENAME_NOREPLACE` / `RENAME_EXCL`) in `write.rs`.
# Already in the workspace lock file (same version as `apps/figstudio`).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tempfile.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
tracing-subscriber.workspace = true
flate2 = { workspace = true }
ruzstd = { workspace = true }
zip = { workspace = true }

[lints]
workspace = true
