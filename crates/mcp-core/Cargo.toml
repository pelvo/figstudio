[package]
name = "figstudio-mcp-core"
description = "Node IDs, figstudio:// links and errors shared by the MCP server and the app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
figstudio-fig = { workspace = true }
# node_bounds for the region walk; no default features, so it stays wasm-safe (no system fonts).
figstudio-render = { path = "../render", default-features = false }
url = { workspace = true }
percent-encoding = { workspace = true }

[lints]
workspace = true
