[package]
name = "figstudio-render"
description = "Renders decoded Figma .fig documents with Vello CPU"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["system-fonts"]
# Draw text that has no stored glyph outlines with fonts installed on this machine.
system-fonts = ["dep:fontdb", "dep:ttf-parser"]
# `Renderer::render_parallel`: horizontal strips on the current Rayon pool (desktop or wasm threads).
parallel = ["dep:rayon"]

[dependencies]
figstudio-fig = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
fontdb = { workspace = true, optional = true }
ttf-parser = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
rayon = { workspace = true }

[lints]
workspace = true
