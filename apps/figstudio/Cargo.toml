[package]
name = "figstudio"
description = "Desktop and browser app for Figma .fig local copies"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
figstudio-fig = { workspace = true }
egui = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
# Only the export test decodes PNGs.
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
figstudio-render = { workspace = true }
# wgpu: eframe's wgpu renderer (Metal, Vulkan, DX12, GL fallback via egui-wgpu defaults), so
# the GPU canvas (docs/GPU.md) can share its device.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11"] }
rfd = { workspace = true }
fontdb = { workspace = true }

# Browser build: see scripts/web-build.sh (nightly, shared memory, Web Worker threads).
[target.'cfg(target_arch = "wasm32")'.dependencies]
figstudio-render = { path = "../../crates/render", default-features = false, features = ["parallel"] }
# wgpu: WebGPU where the browser has it, else WebGL2 (egui-wgpu enables wgpu/webgpu + webgl).
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
# file-handle-inner: the picked `File`, so big files are read in slices, not whole.
rfd = { workspace = true, features = ["file-handle-inner"] }
rayon = { workspace = true }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "File", "HtmlAnchorElement", "HtmlCanvasElement", "Response", "Url", "Window"] }

[lints]
workspace = true
