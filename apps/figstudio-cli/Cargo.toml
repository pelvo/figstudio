[package]
name = "figstudio-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "figstudio-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
figstudio-fig = { workspace = true }
figstudio-render = { workspace = true, features = ["system-fonts"] }
# Shader fills drawn from the shader folder next to the file.
figstudio-shader = { workspace = true }
# Motion exports (render -o out.mp4|webm|gif|zip): frames from mcp-core, files from figstudio-video.
figstudio-mcp-core = { workspace = true, features = ["fs", "system-fonts", "video"] }
figstudio-video = { workspace = true, features = ["av1"] }
figstudio-diff = { workspace = true }
fontdb = { workspace = true }
image = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }

[lints]
workspace = true
