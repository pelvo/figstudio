# Builds the browser app (scripts/web-build.sh: Wasm threads, wasm-bindgen, UI fallback
# fonts) and deploys web/dist to https://figstudio.pelvo.dev, the public static build that
# `figstudio-mcp --browser-proxy` opens. Static assets only (web/wrangler.public.jsonc): no
# Worker script, no Durable Object, so no cloud relay there.
#
# When it runs:
# - Every release: release-please.yml calls it with the new tag once the release is made,
#   so the site always serves the latest release (the npm server and the page it opens
#   come from the same tag).
# - By hand: Actions > web-deploy > Run workflow on main, with an existing tag (for example
#   to redeploy v0.2.0). Tick "dry run" to build and check without deploying.
# - On a pull request that changes the build, the code it compiles or this workflow: build
#   and `wrangler deploy --dry-run` only. No secrets are used.
#
# The bundle (web/dist) is built from the tag. The deploy target (web/wrangler.public.jsonc)
# and wrangler itself (web/deploy/package-lock.json) come from the commit this workflow runs
# from (github.sha: main for a release or a run by hand), so a tag made before those files
# existed deploys too.
#
# Deploying needs the `cloudflare` environment (Settings > Environments), limited to the
# `main` branch, with two secrets:
#   CLOUDFLARE_API_TOKEN   an API token from the "Edit Cloudflare Workers" template, limited
#                          to the account that owns figstudio.pelvo.dev and to that zone
#   CLOUDFLARE_ACCOUNT_ID  that account's ID
# Only the Deploy step sees them. wrangler is installed from the lockfile in an earlier step
# without them, and the build job runs with a read-only token and no secrets.
#
# Third-party actions are pinned to commit SHAs; the comment names the release.

name: web-deploy

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and deploy (for example v0.2.0).
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and deploy (for example v0.2.0).
        required: true
        type: string
      dry_run:
        description: Build and run wrangler deploy --dry-run only; deploys nothing.
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/web-deploy.yml
      - web/wrangler.public.jsonc
      - web/deploy/**
      - web/index.html
      - web/_headers
      - scripts/web-build.sh
      - scripts/web-font.sh
      - scripts/web-symbol-font.py
      # Only this workflow builds the wasm32 threads build, so the code it compiles counts
      # too: a change that breaks only that build (a dependency bump, say) shows on its own
      # PR, not after the release. Release PRs touch Cargo.toml and Cargo.lock too (they
      # bump figstudio's own versions), so each release is also built here before it is
      # tagged.
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - apps/figstudio/**

permissions:
  contents: read

# A newer push to a pull request cancels that PR's older run, as in ci.yml. Release and
# by-hand runs each get their own group (run_id), so they are never cancelled here; the
# deploy job's own group below keeps deploys one at a time.
concurrency:
  group: web-deploy-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Font inputs (see the Fonts step): google/fonts and notofonts/noto-cjk commits, fontTools.
  FONTS_COMMIT: 823468bd7825152bce2b8fd2cf740432ad2fce8d
  CJK_COMMIT: 165c01b46ea533872e002e0785ff17e44f6d97d8
  FONTTOOLS: fonttools==4.65.0

jobs:
  build:
    name: build web/dist
    # Pinned like the release jobs, so a label move does not change the build.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fully qualified, as in release-please.yml: a bare name resolves to a branch first.
          ref: ${{ github.event_name == 'pull_request' && github.sha || format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false
      - name: Rust toolchain
        # The nightly web-build.sh pins (-Z build-std and the shared-memory link flags can
        # break between nightlies), read from the script so the two cannot drift.
        run: |
          # shellcheck disable=SC2016 # the pattern matches a literal ${...} in the script
          tc=$(sed -n 's/^TC="${FIGSTUDIO_WEB_TOOLCHAIN:-\(.*\)}"$/\1/p' scripts/web-build.sh)
          [ -n "$tc" ] || { echo "no pinned toolchain found in scripts/web-build.sh" >&2; exit 1; }
          rustup toolchain install "$tc" --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          key: wasm32-web
          cache-workspace-crates: true
      - name: wasm-bindgen-cli
        # The prebuilt release at the version the checked-out Cargo.lock pins (web-build.sh
        # refuses any other), checked against the SHA-256 of its x86_64-unknown-linux-musl
        # tarball below, not the release's own .sha256sum, which a replaced asset would match
        # too. The table lives in this workflow's commit but is looked up with the tag's
        # Cargo.lock, so it is add-only: a wasm-bindgen bump adds a line in the same PR and
        # keeps the old ones, and redeploying an older tag still finds its version.
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/,"",$3); print $3; exit}' Cargo.lock)
          case "$v" in
            0.2.129) want=82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e ;;
            *)
              echo "::error::Cargo.lock pins wasm-bindgen $v, which has no pinned SHA-256: add a line for it to the wasm-bindgen-cli step in web-deploy.yml (keep the old lines)"
              exit 1
              ;;
          esac
          a="wasm-bindgen-$v-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$a.tar.gz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/$a.tar.gz"
          echo "$want  $a.tar.gz" | sha256sum -c
          tar -xzf "$a.tar.gz"
          echo "$RUNNER_TEMP/$a" >> "$GITHUB_PATH"
      - name: Fonts
        # Every face comes from upstream at a fixed commit, checked by SHA-256, and fontTools
        # from PyPI at a fixed version. No apt: installing fonts-noto-cjk took 16 minutes on
        # one run, and Ubuntu 24.04's Symbols 2 is a 2020 build named "Noto Sans Symbols2",
        # which web-symbol-font.py rejects (it also has no outline Noto Emoji).
        # NotoSansCJK-Regular.ttc is the Sans 2.004 collection, the same file as the distro
        # packages (web-font.sh uses its faces 0..4 and checks each face name).
        run: |
          python3 -m venv "$RUNNER_TEMP/fonttools"
          "$RUNNER_TEMP/fonttools/bin/pip" install -q --disable-pip-version-check "$FONTTOOLS"
          echo "$RUNNER_TEMP/fonttools/bin" >> "$GITHUB_PATH"
          dir="$RUNNER_TEMP/fonts"
          mkdir -p "$dir"
          while read -r var sha url; do
            f="$dir/$(basename "$url" | sed 's/%5Bwght%5D/-Variable/')"
            curl -fsSL --retry 3 -o "$f" "$url"
            echo "$sha  $f" | sha256sum -c
            echo "$var=$f" >> "$GITHUB_ENV"
          done <<EOF
          FIGSTUDIO_CJK_FONT b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a https://raw.githubusercontent.com/notofonts/noto-cjk/$CJK_COMMIT/Sans/OTC/NotoSansCJK-Regular.ttc
          FIGSTUDIO_SYMBOLS_FONT f7e7e04b4a24b6c78893d50cbfd2b2f6cae49617ab047bfef668d252adb128f7 https://raw.githubusercontent.com/google/fonts/$FONTS_COMMIT/ofl/notosanssymbols/NotoSansSymbols%5Bwght%5D.ttf
          FIGSTUDIO_SYMBOLS2_FONT 7d5fb73b7ca67a6798101741f5d280a3d016a56a197afcd4199dbb57b4b82a21 https://raw.githubusercontent.com/google/fonts/$FONTS_COMMIT/ofl/notosanssymbols2/NotoSansSymbols2-Regular.ttf
          FIGSTUDIO_MATH_FONT 3f495fe933c06786e4d5f6d86b8ee70b6753a68ee3b9d87528726de0f6e2c47d https://raw.githubusercontent.com/google/fonts/$FONTS_COMMIT/ofl/notosansmath/NotoSansMath-Regular.ttf
          FIGSTUDIO_EMOJI_FONT de6c18832938afc99caf132b39d6a30a19bac7f2e812e28db2535b4608d27551 https://raw.githubusercontent.com/google/fonts/$FONTS_COMMIT/ofl/notoemoji/NotoEmoji%5Bwght%5D.ttf
          EOF
          # The CJK licence (OFL 2: every copy carries it). web-font.sh copies the LICENSE
          # next to the CJK source font into fonts/cjk-LICENSE.txt. It is at the repo root,
          # not under Sans/.
          curl -fsSL --retry 3 -o "$dir/LICENSE" "https://raw.githubusercontent.com/notofonts/noto-cjk/$CJK_COMMIT/LICENSE"
          echo "6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2  $dir/LICENSE" | sha256sum -c
      - name: Build
        run: scripts/web-build.sh
      - name: Check the bundle
        run: |
          for f in index.html _headers figstudio.js figstudio_bg.wasm \
                   fonts/cjk-jp.otf fonts/cjk-sc.otf fonts/cjk-tc.otf fonts/cjk-hk.otf \
                   fonts/cjk-kr.otf fonts/emoji.ttf; do
            [ -s "web/dist/$f" ] || { echo "::error::web/dist/$f is missing or empty"; exit 1; }
          done
          grep -q 'Cross-Origin-Embedder-Policy: require-corp' web/dist/_headers
          grep -q 'SIL OPEN FONT LICENSE' web/dist/fonts/cjk-LICENSE.txt || {
            echo "::error::web/dist/fonts/cjk-LICENSE.txt has no OFL text"; exit 1; }
      - name: Deploy config from this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .pipeline
          persist-credentials: false
          sparse-checkout: |
            web/wrangler.public.jsonc
            web/deploy/package.json
            web/deploy/package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install wrangler
        # Into the tag's checkout: assets.directory is relative to the config, so the config
        # sits next to dist. Every package comes from the lockfile, with its integrity hash.
        run: |
          cp .pipeline/web/wrangler.public.jsonc web/wrangler.public.jsonc
          mkdir -p web/deploy
          cp .pipeline/web/deploy/package.json .pipeline/web/deploy/package-lock.json web/deploy/
          npm ci --prefix web/deploy --no-audit --no-fund
      - name: wrangler deploy --dry-run
        # Validates the config and the asset upload list without credentials.
        run: web/deploy/node_modules/.bin/wrangler deploy --config web/wrangler.public.jsonc --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy figstudio.pelvo.dev
    needs: build
    if: github.event_name != 'pull_request' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare
      url: https://figstudio.pelvo.dev
    # One deploy at a time. A running upload is never cancelled, and a newer queued deploy
    # replaces an older pending one.
    concurrency:
      group: web-deploy-figstudio-pelvo-dev
      cancel-in-progress: false
    env:
      SITE: https://figstudio.pelvo.dev
    steps:
      # The deploy target and the wrangler lockfile from this workflow's commit, not the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            web/wrangler.public.jsonc
            web/deploy/package.json
            web/deploy/package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install wrangler
        # Its own step with no secrets in env: install scripts never see the token.
        run: npm ci --prefix web/deploy --no-audit --no-fund
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set in the cloudflare environment; nothing was deployed"
            exit 1
          fi
          web/deploy/node_modules/.bin/wrangler deploy --config web/wrangler.public.jsonc
      - name: Check the live site
        # The site serves this run's Wasm and keeps the cross-origin isolation headers
        # (SharedArrayBuffer needs both). New assets usually show within seconds.
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          want=$(sha256sum web/dist/figstudio_bg.wasm | cut -d' ' -f1)
          got=""
          for _ in $(seq 1 24); do
            got=$(curl -fsS --retry 2 "$SITE/figstudio_bg.wasm" | sha256sum | cut -d' ' -f1) || got=""
            [ "$got" = "$want" ] && break
            sleep 5
          done
          if [ "$got" != "$want" ]; then
            echo "::error::$SITE serves figstudio_bg.wasm $got, this build is $want"
            exit 1
          fi
          headers=$(curl -fsSI "$SITE/" | tr -d '\r')
          grep -qi '^cross-origin-opener-policy: same-origin$' <<<"$headers"
          grep -qi '^cross-origin-embedder-policy: require-corp$' <<<"$headers"
          echo "$SITE serves $TAG_NAME ($want)"
