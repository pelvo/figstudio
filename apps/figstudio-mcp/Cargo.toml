[package]
name = "figstudio-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
figstudio-fig.workspace = true
figstudio-diff.workspace = true
figstudio-mcp-core = { workspace = true, features = ["fs", "system-fonts"] }
figstudio-render.workspace = true
base64.workspace = true
html-escape.workspace = true
image.workspace = true
rmcp.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "time"] }
axum = { workspace = true, features = ["ws"] }
getrandom = "0.4"
sha2 = "0.10"
# Constant-time bearer token comparison (access.rs).
subtle = "2"
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
quick-xml.workspace = true
clap.workspace = true
url.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
# HTTPS fetches of the web app for the loopback mirror (web_mirror.rs); gzip/brotli so
# the Wasm module downloads compressed (reqwest decodes it before it is served).
reqwest = { workspace = true, features = ["rustls", "gzip", "brotli"] }

[dev-dependencies]
flate2.workspace = true
zip = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
reqwest.workspace = true
futures-util.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }
tokio-tungstenite = "0.29"
