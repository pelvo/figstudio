# Runs scripts/check.sh (its --lint and --test halves) on every pull request and push to
# main, so CI and the local gate cannot drift apart. The two job names ("fmt + clippy",
# "build + test") are required status checks in the main ruleset; rename them only together
# with the ruleset. The toolchain is pinned to the one docs/TESTING.md names; bump both
# together.
#
# A small `changes` job runs first. When a push or pull request touches only files no check
# reads (docs, Markdown, the web deploy, other workflows), both jobs are skipped by their
# `if:`. A job skipped that way reports success, so the required checks still pass; a
# `paths:` filter on the workflow would leave them waiting forever instead.
#
# The two checks split scripts/check.sh's slices so neither waits on the other: --lint also
# runs the thin-LTO release build, which shares no artifacts with the `fast` profile the
# tests use. Extra slice jobs showed up next to them and compiled the same crates again,
# so the pull request waited just as long. In-job
# `parallel` steps are not used either: a workflow that contained that key failed in
# zero seconds with no jobs, so the required checks never reported.
#
# `prefix-key` is `v1-rust` because an exact hit of `v0-rust` does not save. Those
# entries have no workspace crates, so a hit recompiled this repo and threw the
# result away. The next miss saves them. `cache-all-crates` stays off: at this pin
# it skips registry pruning.
#
# Third-party actions are pinned to commit SHAs; the comment names the release.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  FIGSTUDIO_TOOLCHAIN: 1.99.0

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Does this change touch anything CI checks?
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Files no check reads. Keep this list narrow: anything else, a manual run, or a
          # failure to list the files runs both jobs. Renames count their old path too.
          skip='^(docs/|[^/]+\.md$|(apps|crates)/[^/]+/README\.md$|\.agents/|\.github/(FUNDING\.yml|workflows/(release-please|web-deploy)\.yml)$|release-please-config\.json$|\.release-please-manifest\.json$|wrangler\.jsonc$|web/(_headers|deploy/|e2e/|executor-auth\.mjs|worker/|wrangler\.public\.jsonc)|scripts/(gui-smoke\.sh|macos-app\.sh|mcp-golden\.sh|plan\.sh|thumb-sheet\.py|web-build\.sh|web-serve\.py)$)'
          files=""
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                --jq '.[] | .filename, (.previous_filename // empty)') || files="" ;;
            push)
              # The compare API lists at most 300 files; at that size, run everything.
              files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" \
                --jq 'if (.files | length) >= 300 then error("too many files") else .files[] | .filename, (.previous_filename // empty) end') || files="" ;;
          esac
          if [ -n "$files" ] && ! grep -qvE "$skip" <<<"$files"; then
            echo "only files no check reads changed; skipping fmt + clippy and build + test"
            echo "code=false" >>"$GITHUB_OUTPUT"
          else
            echo "code=true" >>"$GITHUB_OUTPUT"
          fi

  lint:
    name: fmt + clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install "$FIGSTUDIO_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          cache-workspace-crates: true
      - run: scripts/check.sh --lint
      # The workspace's declared MSRV (rust-version), so a newer-Cargo-only manifest or API
      # does not slip in unnoticed.
      - name: MSRV (Rust 1.95) check
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 check --workspace --all-targets --locked

  test:
    name: build + test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install "$FIGSTUDIO_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          cache-workspace-crates: true
      - run: scripts/check.sh --test
      # The shader tests skip without a GPU adapter; on a software one (Mesa's lavapipe) they
      # run, and FIGSTUDIO_REQUIRE_GPU makes a missing adapter a failure, not a skip. After
      # the gate, so the other GPU tests keep the runner as they were. The gate already built
      # these test binaries: `-p figstudio-shader` alone resolves other features and
      # recompiled about 90 crates, so this runs the workspace build's binaries instead.
      - name: Shader tests on a software GPU
        env:
          FIGSTUDIO_REQUIRE_GPU: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers
          mapfile -t tests < <(cargo +"$FIGSTUDIO_TOOLCHAIN" test --profile fast --workspace --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .profile.test and (.manifest_path | endswith("/crates/shader/Cargo.toml"))) | .executable')
          [ ${#tests[@]} -gt 0 ] || { echo "no figstudio-shader test binaries found" >&2; exit 1; }
          cd crates/shader
          for t in "${tests[@]}"; do echo "== $t"; "$t"; done
