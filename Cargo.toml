[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/figstudio", "apps/figstudio-cli", "apps/figstudio-mcp"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
tempfile = "3.23"
figstudio-fig = { path = "crates/fig" }
figstudio-diff = { path = "crates/diff" }
figstudio-render = { path = "crates/render" }
figstudio-mcp-core = { path = "crates/mcp-core", default-features = false }
kiwi-schema = "0.2.1"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9"
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "png", "u8_pipeline"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }
fontdb = { version = "0.24", default-features = false, features = ["std"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std", "variable-fonts"] }
# Fontations exposes embedded bitmap size records (ttf-parser's selector does not).
read-fonts = "0.41"
eframe = { version = "0.36", default-features = false }
egui = "0.36"
rfd = "0.17"
libc = "0.2"
rayon = "1.12"
# GPU tiles (feature `gpu` of figstudio-render). Same vello_common 0.3 and wgpu 30 as the rest.
vello_gpu = { version = "0.3.0", default-features = false, features = ["wgpu", "std"] }
wgpu = "30"
pollster = "0.4"
web-time = "1.1"
rmcp = { version = "~3.5.0", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "signal"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
quick-xml = "0.41"
clap = { version = "4", features = ["derive"] }
url = "2"
percent-encoding = "2.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tokio-util = "0.7"
base64 = "0.23"
html-escape = "0.2"
futures-util = "0.3"
# Logging and errors (docs/LOGGING-PLAN.md).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
tracing-web = "0.1"
thiserror = "2"
anyhow = "1"

[workspace.lints.rust]
# deny, not forbid: the one FFI call (getrusage in `doctor`) is allowed locally with a
# SAFETY comment. Any other unsafe code fails the build.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"

# The profile scripts/check.sh tests and lints with: release speed without the LTO link.
# Thin LTO on ~100 test binaries made a one-line change cost ~20 minutes of linking.
[profile.fast]
inherits = "release"
lto = false
incremental = true
