[project]
name = "figstudio-mcp"
version = "0.1.0"
description = "Local zero-upload browser proxy and offline MCP server for Figma .fig files"
readme = "apps/figstudio-mcp/README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[project.scripts]
figstudio-mcp = "figstudio_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/figstudio_mcp"]
