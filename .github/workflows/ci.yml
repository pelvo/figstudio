# Runs scripts/check.sh (its --lint and --test halves) on every pull request and push to
# main, so CI and the local gate cannot drift apart. The two job names ("fmt + clippy",
# "build + test") are required status checks in the main ruleset; rename them only together
# with the ruleset. The toolchain is pinned to the one docs/TESTING.md names; bump both
# together.
#
# Inside each job, independent slices run at once (GitHub Actions `parallel`). Each slice
# gets its own CARGO_TARGET_DIR: cargo locks one target directory, so sharing it would
# serialize the group. The job name is unchanged, so the ruleset still sees one check.
#
# Swatinem/rust-cache only saves `target/` unless `cache-directories` lists the others.
# Each slice therefore has its own cache entry. `cache-workspace-crates` keeps this
# repo's crates too, not only crates.io dependencies, so a second run skips the compile.
#
# Third-party actions are pinned to commit SHAs; the comment names the release.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  FIGSTUDIO_TOOLCHAIN: 1.99.0

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install "$FIGSTUDIO_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: true
          cache-workspace-crates: true
          cache-directories: |
            target/ci-fmt
            target/ci-clippy-workspace
            target/ci-clippy-parallel
            target/ci-clippy-gpu
            target/ci-clippy-app
      - name: Lint slices
        parallel:
          - name: fmt
            env:
              CARGO_TARGET_DIR: target/ci-fmt
            run: scripts/check.sh --lint-one fmt
          - name: clippy workspace
            env:
              CARGO_TARGET_DIR: target/ci-clippy-workspace
            run: scripts/check.sh --lint-one clippy-workspace
          - name: clippy parallel feature
            env:
              CARGO_TARGET_DIR: target/ci-clippy-parallel
            run: scripts/check.sh --lint-one clippy-parallel
          - name: clippy gpu feature
            env:
              CARGO_TARGET_DIR: target/ci-clippy-gpu
            run: scripts/check.sh --lint-one clippy-gpu
          - name: clippy app without mcp
            env:
              CARGO_TARGET_DIR: target/ci-clippy-app
            run: scripts/check.sh --lint-one clippy-app-no-mcp

  test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install "$FIGSTUDIO_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: true
          cache-workspace-crates: true
          cache-directories: |
            target/ci-tests
            target/ci-tests-gpu
            target/ci-tests-mcp
            target/ci-release
            target/ci-wasm32
      - name: Test and build slices
        parallel:
          - name: workspace tests
            env:
              CARGO_TARGET_DIR: target/ci-tests
            run: scripts/check.sh --test-one tests-workspace
          - name: gpu feature tests
            env:
              CARGO_TARGET_DIR: target/ci-tests-gpu
            run: scripts/check.sh --test-one tests-gpu
          - name: mcp-core no-default-features tests
            env:
              CARGO_TARGET_DIR: target/ci-tests-mcp
            run: scripts/check.sh --test-one tests-mcp-core
          - name: release build
            env:
              CARGO_TARGET_DIR: target/ci-release
            run: scripts/check.sh --test-one release
          - name: wasm32 mcp-core
            env:
              CARGO_TARGET_DIR: target/ci-wasm32
            run: scripts/check.sh --test-one wasm32
