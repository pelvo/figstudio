[package]
name = "figstudio"
description = "Desktop and browser app for Figma .fig local copies"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Agent access: the View menu can start the MCP server inside the app (mcp_host.rs). Desktop
# only; the deps below are native-only, so the browser build never compiles them.
default = ["mcp"]
mcp = ["dep:figstudio-mcp", "dep:tokio", "dep:tokio-util"]

[dependencies]
anyhow.workspace = true
tracing.workspace = true
figstudio-fig = { workspace = true }
# Node IDs and figstudio:// links for the Copy menus (copy.rs), shared with the MCP server.
figstudio-mcp-core = { workspace = true }
egui = { workspace = true }
web-time = { workspace = true }
# The browser's `?renderer=cpu|gpu` query (gpu_scenes.rs); the URL crate's own parser.
form_urlencoded = "1.2"
serde = { workspace = true }

[dev-dependencies]
# Only the export test decodes PNGs.
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# mcp_host tests: an MCP client over HTTP against the hosted server.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json = { workspace = true }
# mcp_wire tests only: room tokens from OS entropy; the shipped desktop binary does not
# compile mcp_wire (it is test- and wasm-only).
getrandom = "0.3.4"
# Headless UI tests (ui_tests.rs): the real App driven without a window, GPU or display.
egui_kittest = { version = "0.36", default-features = false, features = ["eframe"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber.workspace = true
# parallel: page recordings replayed per tile (recordings.rs), as in the browser build.
# gpu: recorded tiles replayed into vello_gpu scenes (gpu_tiles.rs).
figstudio-render = { workspace = true, features = ["gpu"] }
# The GPU canvas: vello_gpu renders tiles on eframe's wgpu device (same wgpu 30).
vello_gpu = { workspace = true }
# Resolves wgpu error-scope futures (immediate on native) for the GPU tile path.
pollster = { workspace = true }
# wgpu: eframe's wgpu renderer (Metal, Vulkan, DX12, GL fallback via egui-wgpu defaults), so
# the GPU canvas (docs/GPU.md) can share its device.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11"] }
rfd = { workspace = true }
fontdb = { workspace = true }
# Feature `mcp`: the app hosts the live MCP server on loopback (same crates as figstudio-mcp).
figstudio-mcp = { path = "../figstudio-mcp", optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

# Browser build: see scripts/web-build.sh (nightly, shared memory, Web Worker threads).
[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-web.workspace = true
tracing-subscriber.workspace = true
# Room tokens via Web Crypto (getrandom's wasm_js backend), never a pseudorandom capability.
getrandom = { version = "0.3.4", features = ["wasm_js"] }
# gpu: tile scenes built on the render worker, rendered on the main thread (gpu_tiles_web.rs).
figstudio-render = { path = "../../crates/render", default-features = false, features = ["parallel", "gpu"] }
vello_gpu = { workspace = true }
# wgpu: WebGPU where the browser has it, else WebGL2 (egui-wgpu enables wgpu/webgpu + webgl).
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
# file-handle-inner: the picked `File`, so big files are read in slices, not whole.
rfd = { workspace = true, features = ["file-handle-inner"] }
rayon = { workspace = true }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
js-sys = "0.3"
# The bridge client's JSON frames (mcp_web.rs); the protocol types come from mcp-core.
serde_json = { workspace = true }
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "CssStyleDeclaration", "Document", "Element", "File", "History", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "Location", "Navigator", "Response", "Storage", "Url", "Window", "WebSocket", "MessageEvent", "CloseEvent", "Event"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
muda = { version = "0.21.2", default-features = false }

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6"

[lints]
workspace = true
