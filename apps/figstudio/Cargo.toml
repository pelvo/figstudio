[package]
name = "figstudio"
description = "Desktop and browser app for Figma .fig local copies"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Agent access: the View menu can start the MCP server inside the app (mcp_host.rs). Desktop
# only; the deps below are native-only, so the browser build never compiles them.
default = ["mcp"]
mcp = ["dep:figstudio-mcp", "dep:tokio", "dep:tokio-util"]

[dependencies]
anyhow.workspace = true
tracing.workspace = true
figstudio-fig = { workspace = true }
# Node IDs and figstudio:// links for the Copy menus (copy.rs), shared with the MCP server.
figstudio-mcp-core = { workspace = true }
egui = { workspace = true }
web-time = { workspace = true }
# Validate outline fonts before the browser installs fetched fallback faces; also used natively.
ttf-parser = { workspace = true }
# The browser's `?renderer=cpu|gpu` query (gpu_scenes.rs); the URL crate's own parser.
form_urlencoded = "1.2"
# The caller room is derived from the executor secret (mcp_pair.rs): RustCrypto's SHA-256,
# trusted crate, synchronous on native and Wasm (no Web Crypto bridge needed).
sha2 = "0.10"
serde = { workspace = true }
# Saved space styles (spaces.rs), and the bridge client's JSON frames in the browser.
serde_json = { workspace = true }
# A typed space icon keeps its first grapheme (one emoji, flags and skin tones included).
unicode-segmentation = "1.13"

[dev-dependencies]
# Only the export test decodes PNGs.
image = { workspace = true }
# link_open tests: a folder with a local copy of a fixture.
tempfile = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# mcp_host tests: an MCP client over HTTP against the hosted server.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
# mcp_pair (executor entropy) is test- and wasm-only; the shipped desktop binary does
# not compile it, so this stays a dev-dependency on native.
getrandom = "0.3.4"
# Headless UI tests (ui_tests.rs): the real App driven without a window, GPU or display.
egui_kittest = { version = "0.36", default-features = false, features = ["eframe"] }
# theme tests: egui's bundled fonts, whose symbol coverage is known.
epaint_default_fonts = "0.36"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber.workspace = true
# parallel: page recordings replayed per tile (recordings.rs), as in the browser build.
# gpu: recorded tiles replayed into vello_gpu scenes (gpu_tiles.rs).
figstudio-render = { workspace = true, features = ["gpu"] }
# The GPU canvas: vello_gpu renders tiles on eframe's wgpu device (same wgpu 30).
vello_gpu = { workspace = true }
# Resolves wgpu error-scope futures (immediate on native) for the GPU tile path.
pollster = { workspace = true }
# wgpu: eframe's wgpu renderer (Metal, Vulkan, DX12, GL fallback via egui-wgpu defaults), so
# the GPU canvas (docs/GPU.md) can share its device.
# persistence: window size and place, panel widths and the sidebar state survive a restart.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11", "persistence"] }
rfd = { workspace = true }
fontdb = { workspace = true }
# The platform's config folder for saved space styles (spaces.rs).
dirs = "6"
# Recents: reading the page pictures back (already built for figstudio-render).
image = { workspace = true }
# Recents: Show in Finder / in the file manager (reveal), not a hand-rolled per-OS launch.
opener = { version = "0.9", features = ["reveal"] }
# Saving them atomically: a uniquely named temporary file (created new, owner-only on Unix),
# renamed over the store (spaces.rs).
tempfile.workspace = true
# Feature `mcp`: the app hosts the live MCP server on loopback (same crates as figstudio-mcp).
figstudio-mcp = { path = "../figstudio-mcp", optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

# Browser build: see scripts/web-build.sh (nightly, shared memory, Web Worker threads).
[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-web.workspace = true
tracing-subscriber.workspace = true
# Room tokens via Web Crypto (getrandom's wasm_js backend), never a pseudorandom capability.
getrandom = { version = "0.3.4", features = ["wasm_js"] }
# gpu: tile scenes built on the render worker, rendered on the main thread (gpu_tiles_web.rs).
figstudio-render = { path = "../../crates/render", default-features = false, features = ["parallel", "gpu"] }
vello_gpu = { workspace = true }
# wgpu: WebGPU where the browser has it, else WebGL2 (egui-wgpu enables wgpu/webgpu + webgl).
eframe = { workspace = true, features = ["default_fonts", "wgpu", "persistence"] }
# file-handle-inner: the picked `File`, so big files are read in slices, not whole.
rfd = { workspace = true, features = ["file-handle-inner"] }
rayon = { workspace = true }
# Recents: reading the page pictures back (already built for figstudio-render).
image = { workspace = true }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Blob", "BroadcastChannel", "BlobPropertyBag", "CssStyleDeclaration", "Document", "Element", "File", "Headers", "History", "HtmlAnchorElement", "HtmlCanvasElement", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "ImageData", "TextMetrics", "HtmlElement", "Location", "MediaQueryList", "EventTarget", "Navigator", "RequestInit", "Response", "Storage", "Url", "Window", "WebSocket", "MessageEvent", "CloseEvent", "Event"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
muda = { version = "0.21.2", default-features = false }

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6"
# The taskbar jump list of recent files (jump_list.rs) and the foreground hand-over of a
# launch (handoff.rs): the Windows bindings that eframe, muda and rfd already pull in, at
# the same version.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }

# The blurred window background (vibrancy.rs): AppKit through the objc2 bindings eframe,
# muda and rfd already use.
[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSAppearance", "NSApplication", "NSGraphics", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow"] }

[lints]
workspace = true
