[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/figstudio", "apps/figstudio-cli", "apps/figstudio-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
tempfile = "3.23"
figstudio-fig = { path = "crates/fig" }
figstudio-render = { path = "crates/render" }
kiwi-schema = "0.2.1"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "png", "u8_pipeline"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
eframe = { version = "0.36", default-features = false }
egui = "0.36"
rfd = "0.17"
libc = "0.2"
rayon = "1.12"
web-time = "1.1"
rmcp = { version = "~3.5.0", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "signal"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
quick-xml = "0.41"
clap = { version = "4", features = ["derive"] }
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tokio-util = "0.7"
base64 = "0.23"
futures-util = "0.3"

[workspace.lints.rust]
# deny, not forbid: the one FFI call (getrusage in `doctor`) is allowed locally with a
# SAFETY comment. Any other unsafe code fails the build.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
