[package]
name = "figstudio-render"
description = "Renders decoded Figma .fig documents with Vello CPU"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["system-fonts"]
# Draw text that has no stored glyph outlines with fonts installed on this machine.
system-fonts = ["fontdb/fs", "fontdb/memmap", "fontdb/fontconfig", "dep:read-fonts"]
# `Renderer::render_parallel`: horizontal strips on the current Rayon pool (desktop or wasm threads).
parallel = ["dep:rayon"]
# `Recording::gpu_scene`: replay a recorded tile into a `vello_gpu::Scene` (app canvas on the GPU).
gpu = ["parallel", "dep:vello_gpu"]

[dependencies]
figstudio-fig = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
tracing.workspace = true
fontdb.workspace = true
ttf-parser.workspace = true
read-fonts = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
vello_gpu = { workspace = true, optional = true }

[dev-dependencies]
rayon = { workspace = true }
# tests/gpu.rs: a headless wgpu device (default backends) to read GPU tiles back.
wgpu = { workspace = true }
pollster = { workspace = true }
# text.rs unit tests: fonts with known coverage, so fallback tests do not depend on the host.
epaint_default_fonts = "0.36"

[lints]
workspace = true
